include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.50 (stable) menandai material.dart
    # deprecated demi package:material_ui — migrasi belum dilakukan di base model,
    # jadi di-ignore sementara. Lihat docs/LIBRARIES.md atau Decisions Log untuk detail & rencana migrasi.
    deprecated_member_use: ignore
  exclude:
    - build/**
