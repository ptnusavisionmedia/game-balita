name: core
description: Design system, model, dan service bersama untuk semua mini-game Bayi GuguGaga.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0   # musik/VO panjang
  soundpool: ^2.4.0      # SFX pendek, latensi rendah (tap/benar/salah)
  confetti: ^0.7.0       # animasi reward, bukan particle system manual
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.0+1
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
