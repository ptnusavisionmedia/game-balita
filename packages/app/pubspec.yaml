name: bayi_gugugaga_app
description: Shell app Bayi GuguGaga - menu utama & navigasi ke semua mini-game.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  feature_angka:
    path: ../feature_angka
  feature_warna:
    path: ../feature_warna
  feature_hewan:
    path: ../feature_hewan
  feature_musik:
    path: ../feature_musik
  feature_mewarnai:
    path: ../feature_mewarnai
  feature_puzzle:
    path: ../feature_puzzle

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# NOTE: package ini belum punya folder android/ios/web.
# Jalankan dari dalam packages/app:
#   flutter create . --platforms=android,ios,web --org com.gugugaga
# lalu commit hasilnya.
