# Binary CLI = `godot` (bukan `godot4`) di image barichello/godot-ci — sudah
# dicek ke contoh resmi repo-nya. Flag `--quit-after` sudah diverifikasi jalan
# lokal (Godot 4.7.2 Windows) oleh sesi AI — lihat obsidian-vault/Decisions Log.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Buka tiap scene headless (tangkap error GDScript/scene)
        run: |
          for scene in scenes/Home.tscn scenes/Settings.tscn \
            features/feature_angka/Angka.tscn features/feature_warna/Warna.tscn \
            features/feature_hewan/Hewan.tscn features/feature_musik/Musik.tscn \
            features/feature_mewarnai/Mewarnai.tscn features/feature_puzzle/Puzzle.tscn; do
            echo "=== $scene ==="
            godot --headless --path . "$scene" --quit-after 1
          done

      # TODO Bramantyo: tambah job export APK debug begitu export_presets.cfg
      # dan keystore sudah disiapkan (lihat docs/DOCKER.md, docs/JOBS_BASE_MODEL.md Job 1).
      # Contoh resmi export headless: https://github.com/abarichello/godot-ci/blob/master/.github/workflows/godot-ci.yml
