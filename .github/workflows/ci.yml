name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    # Image sama dengan Dockerfile lokal, biar hasil CI = hasil lokal.
    # Wajib Dart >=3.6 (native pub workspaces) — Flutter 3.50.0 (Dart 3.14)
    # sudah terverifikasi jalan.
    container: ghcr.io/cirruslabs/flutter:3.50.0
    steps:
      - uses: actions/checkout@v4

      - name: Get dependencies (workspace, termasuk Melos sebagai dev_dependency)
        run: flutter pub get

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test
