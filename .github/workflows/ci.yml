name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scope-check:
    # Hanya relevan untuk PR (perlu bandingkan ke base branch). Lihat docs/ROLES.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cek 1 PR = 1 modul packages/
        run: bash scripts/check_pr_scope.sh origin/${{ github.base_ref }}

  analyze-test:
    runs-on: ubuntu-latest
    # Image sama dengan Dockerfile lokal, biar hasil CI = hasil lokal.
    container: ghcr.io/cirruslabs/flutter:3.24.3
    steps:
      - uses: actions/checkout@v4

      - name: Activate Melos
        run: dart pub global activate melos 1.0.1

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test
